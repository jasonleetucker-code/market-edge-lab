id = "EXP-004"
title = "Track B TB-01: late-game favourite underpricing in Kalshi NBA/MLB game markets, scheduled-start clock, scored at the ask (DRAFT, QUEUED)"
status = "DRAFT"
owner = "jasonleetucker-code"
created = "2026-10-08"

hypothesis = """
DRAFT, not preregistered. A WEAKENED hypothesis (adversarial review R6, 2026-10-08), not an edge.
In Kalshi NBA and MLB game-winner markets, at the first minute in which the game is late by a
clock known before the game (minutes since the scheduled start, not the realized market close)
and the favourite's one-minute-candle yes_ask close is between 0.60 and 0.90, buying the favourite
at that ask (conservatively, at the next minute's ask high) has a game-clustered mean net return
per dollar above zero after the taker fee, with one decision per game. The null hypothesis is that
this mean is at or below zero. The published effect (Moshrefi, arXiv 2607.14430) bucketed trades by
the market close, which for these markets is the realized end of the game; that conditions on the
future, and overtime and extra-innings selection predicts the paper's league ordering
(NHL 4.56 > MLB 2.05 > NBA 1.62). This experiment asks whether anything survives a decision-time
clock and the ask.
"""

economic_rationale = """
A residual "Yogi Berra" bias (losing-side hope, Page 2012 on Intrade) could keep late favourites
cheap, and makers may withdraw late in games. Competitors would not remove a few-cent effect if size
per game is small and books are fast. Against it (R6): realized-close bucketing plus overtime
selection plausibly explains most of the MLB effect and part of the NBA effect; sweep prints after
decisive plays are the footprint of makers being picked off by the fastest takers, not an edge for
a slow participant; trade-count weighting amplifies both; Le (2026), quantity-weighted and
event-clustered, finds Kalshi sports close to calibrated at 0-48 h (0-1 h slope 1.10); Kagan and
Baiocchi (Kalshi-hosted working paper, August 2026, https://kalshi.com/research/kalshi-research-calibration.pdf,
cited from owner-supplied external research of 2026-10-08) find better calibration once actual
game-end timing corrects the clock (exchange-hosted, private timing data, not a clean independent
refutation). The prior is that the taker version fails at the ask.
"""

market = "Kalshi NBA and MLB full-game winner series (KXNBAGAME, KXMLBGAME as named in fee_schedules.py; confirmed against the approved dataset). Excluded: NFL (EXP-002 scope), NHL (Track B excludes NHL outcomes), combos (KXMVE*), KXHIGHNY"
decision_time = "TBD: the first one-minute candle at or after the late threshold (minutes since scheduled start; one threshold per league) in which the favourite's yes_ask close is in [0.60, 0.90]; thresholds frozen from league schedules and feature-only candle-time distributions before any label is viewed"
model = "No fitted model. Deterministic rule: one decision per game, buy the favourite at the candle ask. Calibration curves by price x clock bucket are secondary (planned research_diagnostics.calibration_report, research/tb-harness lane, not merged)"

