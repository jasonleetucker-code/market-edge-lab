[stopping]
futility = "KILL (R6, written in now and to be frozen unchanged): stop and record FALSIFIED if, on the validation block, the game-clustered 95% upper bound of the primary endpoint is at or below zero, or its point estimate is at or below zero. ARTEFACT: record FALSIFIED (artefact) if the effect is present under realized-close bucketing and absent under the scheduled-start clock. UNINFORMATIVE: if the positive control fails, record INSUFFICIENT_EVIDENCE rather than a pass or a kill."
stop = [
  "ACCESS_BLOCKED: no A2 grant, or DATA_RIGHTS unresolved, by the review date",
  "STATISTICAL_FUTILITY: the KILL rule above",
  "ECONOMICALLY_UNVIABLE: point estimate below the owner's minimum useful effect after the fee band",
  "OPERATIONALLY_UNUSABLE: the effect exists only in minutes without an ask or only in sweep minutes",
]
continue_rule = "Continue to a prospective NBA window only if the validation lower 95% bound is above zero at the conservative ask, all controls behave, and the fee is verified; otherwise stop with the named verdict."
verdicts = ["ACCESS_BLOCKED", "ECONOMICALLY_UNVIABLE", "STATISTICAL_FUTILITY", "OPERATIONALLY_UNUSABLE", "BUDGET_EXHAUSTED", "INSUFFICIENT_EVIDENCE", "CONTINUE"]

