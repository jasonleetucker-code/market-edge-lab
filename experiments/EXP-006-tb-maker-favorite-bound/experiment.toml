id = "EXP-006"
title = "Track B TB-03: maker favourite-side premium on Kalshi non-sports markets after maker fees, two-sided retrospective fill bound (DRAFT, QUEUED)"
status = "DRAFT"
owner = "jasonleetucker-code"
created = "2026-10-08"

hypothesis = """
DRAFT, not preregistered. A WEAKENED hypothesis (adversarial review R6, 2026-10-08; near-KILL in
sports, which this experiment excludes), not an edge. On Kalshi non-sports markets, a resting bid on
the favourite side at prices from 0.70 to 0.95 earns a positive event-clustered mean net return per
dollar after the per-series maker fee. A retrospective tape cannot estimate what our resting orders
would have filled; it can only bound it. Optimistic bound: the return of all maker fills on the
favourite side in band, net of the maker fee (what incumbents with queue priority earned).
Pessimistic bound: the return of trade-through fills only (prints strictly through our level while
the one-minute candle shows the level at or inside the touch). The null hypothesis for this
experiment is that the optimistic bound is at or below zero, which would kill the hypothesis for
us. A positive bound only earns a forward virtual-maker study; it never shows an edge.
"""

economic_rationale = """
Takers pay for immediacy and for affirmative longshots; the maker on the other side of a longshot
purchase is buying the favourite. Becker reports makers +1.12 percent and takers -1.12 percent
(gross, trade-level, naive CIs); category maker returns reach about +3.6 percent (media and world
events; the +7.3 figure is the maker-taker gap, R6 section 7). Whelan reports makers buying at 50
cents or more earning +2.6 percent after commission (2021 to April 2025, no-maker-fee regime), not
replicated day by day. Against it: the maker gain is the mirror image of the taker loss among
incumbents; takers won until 2024 Q2; a new maker queues last and is filled disproportionately by
informed sweeps; a slow maker cannot cancel on news; Kalshi's affiliated sports market maker was
said to be not profitable.
"""

market = "Kalshi binary markets outside the Sports category with series fee_type read (candidate categories: economics, financials, crypto, climate other than KXHIGHNY, entertainment, media, world). Excluded: all sports (near-KILL per R6, and NFL/NHL scopes), combos (KXMVE*), KXHIGHNY, exclusive-event baskets and complement pairs (EXP-003 Family B)"
decision_time = "TBD: hypothetical bid posting instants on a fixed grid relative to scheduled close (for example every hour from 24 h to 1 h before close), frozen before any label look"
model = "No fitted model. Deterministic bounds from trades with taker side and one-minute candles. The optimistic bound reads incumbent maker fills; the pessimistic bound reads trade-through fills of a hypothetical bid at the touch"

