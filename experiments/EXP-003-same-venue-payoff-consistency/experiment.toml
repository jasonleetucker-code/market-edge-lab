id = "EXP-003"
title = "Family B: same-venue payoff consistency (complements, exhaustive partitions, nested thresholds) (DRAFT)"
status = "DRAFT"
owner = "jasonleetucker-code"
created = "2026-09-25"

hypothesis = """
DRAFT, not preregistered. On one venue, sets of contracts whose settlement states are
completely enumerated and proven (verified complements, mutually exclusive and exhaustive
partitions, verified nested thresholds) are sometimes offered at executable asks whose all-in
acquisition cost is below the worst-state payout net of state-dependent settlement costs and
refunds, at a fillable size, often enough and for long enough to matter in dollars. The null
hypothesis is that after fees, depth and quote timing no worst-state full-fill surplus exists.
"""

economic_rationale = """
Order books for related contracts are quoted by different participants and may not be kept
mutually consistent at every instant. A mathematical relationship needs no outcome-probability
model. It still needs complete settlement-state proofs, native units, fees at the correct
rounding scope, overlapping quote-validity times, depth, and a plan for partial or orphan legs.
A conditional full-fill surplus is not captured arbitrage, and same-venue legs are not atomic.
"""

market = "TBD: an allowlist of same-venue relationship sets. First candidate: Kalshi KXHIGHNY daily bracket partitions and YES/NO complements from stored market-side books only (protocol.toml [universe])"
decision_time = "TBD: every stored book-capture instant at which all legs have quotes with overlapping validity intervals; frozen before preregistration"
model = "No probability model. Deterministic proof and pricing by the pure payoff evaluator (edge_lab.payoff_constraints, PR B): payout matrix over admissible settlement states, worst-state full-fill surplus at size"

