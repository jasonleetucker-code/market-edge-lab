id = "EXP-002"
title = "Family A: NFL pregame moneyline sportsbook consensus vs executable event-market prices (DRAFT)"
status = "DRAFT"
owner = "jasonleetucker-code"
created = "2026-09-25"

hypothesis = """
DRAFT, not preregistered. At a named pregame horizon, the existing sportsbook consensus
research benchmark (odds-consensus-v1: exact-line proportional two-way de-vig, median across
books) carries information about the final outcome of an NFL game that the executable ask of
a payoff-equivalent event-market contract (first intended route: Kalshi) does not already
price, by more than all-in costs, often enough and at enough fillable size to matter in
dollars. Exactly one primary objective will be chosen before preregistration: (a) calibration /
outcome information at defined pregame horizons, or (b) predictive markout at a named later
horizon. The null hypothesis is that executable prices already reflect the consensus.
"""

economic_rationale = """
Sportsbook lines aggregate many professional prices; event-market order books in the same
game may be thinner and updated less often. The rationale is unproven. A two-way moneyline
de-vig encodes economics conditional on the book's own tie/void rules and is not automatically
an unconditional binary team-win probability; related-but-not-equivalent contracts are never
compared as if equivalent. Any edge may be too small, too rare or too thin to fill.
"""

