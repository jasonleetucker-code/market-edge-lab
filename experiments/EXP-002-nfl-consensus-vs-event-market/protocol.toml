# Research-protocol sidecar (research-protocol-v1). DRAFT: explicit UNKNOWN / MISSING_* values
# are honest placeholders; every decision field must be settled before PREREGISTERED
# (experiments/README.md, Research-protocol sidecar). Nothing here is a validated strategy.

protocol_version = "research-protocol-v1"
experiment_id = "EXP-002"
family = "A"
family_title = "Narrow sportsbook information vs executable event-market pricing"
slot_status = "ACTIVE"
authority = "docs/owner/2026-09-25-economic-evidence-v1-directive.md; docs/EXECUTION_PLAN.md 2026-09-25 entry; issue #96"
mechanism = "Sportsbook lines aggregate many professional prices and may move before thinner event-market books reprice; if an event-market ask for a payoff-equivalent contract lags the consensus by more than all-in costs, buying it has positive expected value."
named_hypothesis = "H-A1 (consensus information): at a frozen pregame horizon, the odds-consensus-v1 probability for a payoff-equivalent NFL moneyline contract exceeds its executable all-in ask by more than a frozen threshold often enough, and at enough fillable size, to clear the owner's minimum useful economic effect."
baseline = "odds-consensus-v1 exactly as implemented (edge_lab.odds_api pair_offers / group_propositions / median; proportional two-way de-vig; exact line; no weighting, no filters) versus the executable ask; plus the no-trade baseline (zero contribution, zero capital)."
# OPEN DECISIONS (not settled values). Each must be decided, with evidence, before PREREGISTERED.
# Items 1 and 2 were raised by EE Writer 2 (PR C, #101). 2026-09-25 (RU Writer R): the rules facts are
# now VERIFIED against the captured market rules (tests/fixtures/sports_evidence/) and the Kalshi
# FOOTBALLGAMEWIN contract terms (rules_evidence/MANIFEST.md). Recommendations for every item are
# PROPOSED, not settled, in docs/research/RESEARCH_UNBLOCKING_DECISIONS.md (section in brackets).
open_decisions = [
  "OPEN 1, tie and not-played treatment [A.D]. VERIFIED rules: a tie after overtime pays $1/(tied teams) rounded down ($0.50); a game not started within 48 h, suspended before 55 minutes and not resumed within 48 h, forfeited before kickoff, moved outside its week or with home/away reversed, or with a team disqualified before the game resolves at a discretionary last fair price; a team disqualified after the start resolves No. The sportsbook de-vig is conditional on the books' own tie/void rules (UNVERIFIED), so every pair is a CONDITIONAL mapping. PROPOSED: explicit payoff modelling with ex-ante bounds on tie and non-standard-resolution probabilities (sports_evidence.tie_adjusted_interval), every state kept in the sample.",
  "OPEN 2, input ages and pair skew [A.C]. The source limits are CURRENT (odds 10 min, Kalshi book 5 min). PR C's 10-minute symmetric skew is a candidate only. PROPOSED provisional window: the book from 5 min before to 10 min after the odds receipt, calibrated on development-pilot timing data only, frozen before any outcome or markout is viewed.",
  "OPEN 3, the size ladder rungs ([size_capital] size_ladder) [A.E]. PROPOSED: 1, 10, 50, 100, 250 contracts.",
  "OPEN 4, the episode definition: start threshold, end/merge gap and minimum size ([episode]) [A.F].",
  "OPEN 5, the minimum number of independent clusters (NFL weeks) before a screen verdict ([economics] min_independent_clusters), and the minimum episode count for an annual scenario ([economics] min_episodes_for_scenario) [A.G]; sensitivity ranges from scripts/research_power_sensitivity.py; the frozen values need a logged development pilot.",
  "OPEN 6, the primary endpoint [A.A]. PROPOSED (revised after review): a cross-book predictive markout. The sign of the T-6h consensus-vs-Kalshi-mid gap comes from one team market's book and the mid change to T-60m is measured on the other team market's book, averaged over both assignments, because a same-book markout is biased upward under a no-information null (mid-noise reversion). A Kalshi-only placebo (the signal book's own T-24h mid instead of the consensus) is a required bias check, plus pre-freeze checks of the cross-book noise correlation. Chosen on data design and power with no result viewed.",
]

[universe]
eligible = "NFL regular- and post-season games; pregame moneyline (team-win) only; one execution-candidate venue first (Kalshi) and only contracts whose captured rules, tie/overtime/postponement/void treatment and payout units are mapped as payoff-equivalent to the consensus side. No other league, market type (spreads, totals, props) or venue is added to inflate the sample."
exclusions = [
  "Contracts whose mapping is RELATED_NOT_EQUIVALENT (every Polymarket US NFL market today, ADR 0032): kept as observations, never compared as equivalent",
  "Two-way de-vig where a tie, void or refund state is unmapped: excluded with reason UNSUPPORTED_RULES (a conditional-on-no-tie probability is not an unconditional team-win probability)",
  "Horizons without a paired event-market book received at or before the cutoff: DATA_GAP, never filled from a later book",
]

[observation]
unit = "Game (one NFL game = one outcome unit). Markets, sides, books and horizons are nested inside it."
clusters = [
  "game: both team sides, every book, every horizon and every snapshot of one game are one cluster",
  "NFL week / slate: games in the same week share news, weather and market-wide flows; uncertainty is also clustered by week",
]
dependence = "Books are not independent (shared line sources); sides of one game are complements; repeated snapshots re-observe the same liquidity. Uncertainty is computed on game- and week-clustered units, never on book or snapshot counts: research_economics bootstraps on the coarsest level present on every episode (outer_cluster_id = NFL week)."

[endpoints]
primary = "UNKNOWN: exactly one of (a) calibration/outcome information at a frozen horizon (for example a log-score difference vs a market probability benchmark, never the executable ask) or (b) predictive markout at a named later horizon; to be chosen and frozen before preregistration. PROPOSED (not settled): (b), a cross-book markout T-6h to T-60m with a Kalshi-only placebo as a required bias check (docs/research/RESEARCH_UNBLOCKING_DECISIONS.md A.A)."
secondary = [
  "After-cost conditional contribution per game at each size-ladder rung (research_economics)",
  "Episode persistence bounds at capture-schedule resolution (never below it)",
  "Attrition waterfall with separate denominators (research_evidence.attrition_report)",
]

