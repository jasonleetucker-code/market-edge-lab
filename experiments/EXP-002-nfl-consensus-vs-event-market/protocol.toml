fills = "Depth-walk of the captured ask ladder at the cutoff; two bounds, never a sum (research_economics fill-mode labels v2, ADR 0037): FIRST_DETECTION_ZERO_LATENCY (enum CONSERVATIVE: the episode's first qualifying observation at its receipt time, with no decision or submission delay, so not delay-adjusted) and HINDSIGHT_UPPER_BOUND (enum LESS_CONSERVATIVE: the best single observation, chosen after the whole episode was seen: an oracle upper bound that may only rule the family out). Neither is executable performance. Observed depth is a ceiling, not a guaranteed fill; no fill probability is assumed. (Corrected 2026-09-25 while DRAFT; the v1 wording called these conservative and less-conservative.)"
