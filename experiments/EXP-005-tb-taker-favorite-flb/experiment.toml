id = "EXP-005"
title = "Track B TB-05: taker favourite-side favourite-longshot bias in short-dated Kalshi non-sports markets, event-equal weight, scored at the ask (DRAFT, QUEUED)"
status = "DRAFT"
owner = "jasonleetucker-code"
created = "2026-10-08"

hypothesis = """
DRAFT, not preregistered. A WEAKENED hypothesis (adversarial review R6, 2026-10-08), not an edge.
In Kalshi non-sports binary markets scheduled to close within a fixed horizon of the decision,
buying the favourite side (YES or NO, whichever is quoted in the favourite band [0.70, 0.95]) at the
one-minute-candle ask has an event-clustered, event-equal-weight mean net return per dollar above
zero after the taker fee, with one decision per event. The null hypothesis is that this mean is at
or below zero. Published support is at trade prices and trade or contract weight: Burgi, Deng and
Whelan (2026) report small positive post-fee returns above 70 cents through April 2025, with the
yearly slope halving in 2025; on Polymarket the bias reverses at event-equal weight (Cardozo and
Rivero-Wildemauwe 2026).
"""

economic_rationale = """
Takers overpay for affirmative longshots (probability weighting, lottery demand), so the favourite
side may be cheap. The edge is at most low single-digit percent with sd about 30 percent per
contract, and it is concentrated near prices where one tick is a large share of the edge: at 0.99
the Becker-implied gross edge (about 0.41 percent) is below one 1-cent tick (about 1 percent of
outlay), which is why the band stops at 0.95. Competitors may not remove a small, high-variance,
capital-intensive edge. Against it: decay since 2025, event-weight reversal, and Becker's effect is
YES-specific (affirmative bias), not a pure price-level effect.
"""

