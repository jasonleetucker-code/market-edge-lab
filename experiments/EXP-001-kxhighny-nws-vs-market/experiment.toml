id = "EXP-001"
title = "KXHIGHNY: NWS-forecast-implied probability vs executable Kalshi prices"
status = "PREREGISTERED"
owner = "jasonleetucker-code"
created = "2026-09-22"

hypothesis = """
At a fixed decision time before the market closes, a calibrated probability for each
KXHIGHNY bracket, derived only from NWS forecasts available at that time, differs from the
executable Kalshi ask/bid by more than fees plus spread, often enough and by enough to have
positive expected value after costs.

Tested in two separate stages. Stage A (historical, data exist): the forecast-derived
probabilities are informative and calibrated on a held-out period; a prerequisite, not
evidence of an edge. Stage B (prospective shadow trading, data do not exist yet): the
probabilities beat executable prices after fees.
"""

economic_rationale = """
Retail-heavy weather markets may misprice short-horizon temperature risk relative to
professional numerical forecasts, or react slowly to forecast updates. The rationale is
unproven. The null hypothesis is that prices already reflect public NWS forecasts.
"""

market = "Kalshi KXHIGHNY (Highest temperature in NYC), daily brackets"
decision_time = "18:00 America/New_York on D-1 for target date D (UTC via the US DST rule, edge_lab.dataset_exp001.decision_time). Forecast availability cutoff = decision - 30 min: use the latest PFMOKX issuance (WMO header time, within 0-15 min after its local issuance line) with issuance <= cutoff, a Central Park max for D, and age <= 24 h at the cutoff; nothing issued later is ever used; suffixed products (CCx/RRx/AAx) are never used; same-minute latest products that disagree exclude the row (ADR 0010)."
model = "Empirical integer error pmf: P(y = f + k) = (n_k + 0.5) / (N + 0.5*41), k in [-20, 20] (outside errors counted/scored at +-20), f = forecast_max_f. Variants exactly two: V1 pooled; V2 one pmf per meteorological season of D (n_k and N counted within the season). Fit on usable train days for validation scoring; selected variant refit once on train+validation for test scoring; refit once on all usable days through 2026-09-21 for Stage B. Selection: V2 only if mean validation per-day log-score difference (V2 - V1) > 0 and its 95% block-bootstrap lower bound > 0, else V1. Bracket probability = pmf summed over integers that settlement.resolve maps to YES. References: R0 monthly climatology (add-0.5 over integer support [min label - 10, max label + 10] of the fit window); R1 discretized Gaussian N(f + mu, sigma^2) from fit-window errors, prob floor 1e-9 (reported only). Bootstrap everywhere: edge_lab.stats.block_bootstrap_mean_ci as frozen (circular moving blocks of 7 days, starts random.Random(20260922).randrange(n), ceil(n/7) blocks truncated to n, 10000 resamples, bounds m[floor(alpha/2*B)] and m[ceil((1-alpha/2)*B)-1], alpha 0.05 unless stated; per-day values of usable days in date order). Full spec: gate3/DESIGN.md section 5."

data_sources = [
  "iem_afos_pfmokx: NWS OKX Point Forecast Matrices as issued (IEM AFOS archive), Central Park NYZ072 daytime max; committed as exact extracts tests/fixtures/gate3/pfm_extracts_YYYY.jsonl.gz with full-product SHA-256 (ADR 0011)",
  "Settlement label: Kalshi expiration_value when the date's event records one, else NWS CLI value under the Gate 2 contract report-selection rules (nws_cli.settlement_value); rows where both exist and differ (KALSHI_CLI_CONFLICT) or where an event's markets disagree (KALSHI_VALUE_INCONSISTENT) are excluded (none in dataset v2)",
  "iem_afos_clinyc: NWS CLI Central Park reports 2016-12-31..2026-09-23 (gate2 + gate3 fixtures)",
  "kalshi_settlement: captured KXHIGHNY/HIGHNY settled markets 2021-08-06..2026-09-21 (tests/fixtures/gate3/kalshi_markets_all_2026-09-22.json.gz)",
  "Dataset: EXP-001-pit-v2 (builder v2, PFM parser v3), experiments/EXP-001-kxhighny-nws-vs-market/gate3/dataset.csv sha256=1794b23cd519a4c4a952700dc97530df0f0452f070962c0cb7500fd1afcef51a (gate3/dataset_manifest.json); 3551 candidate days, 3551 usable",
  "Frozen specification artifacts: experiments/EXP-001-kxhighny-nws-vs-market/gate3/DESIGN.md sha256=e8c2241720f8753aaef6fe43b4be979a54fb79b9eb5d399de9dd7856782ca180; src/edge_lab/fees.py sha256=13925022e7bee7c4c27214d8fa44b99a53e6795e5d8054b79a8dd6b9a5789396; src/edge_lab/stats.py sha256=7354cf93ec7b06fd2661d7f3cfe1c80c48e0d6c21a2888e56677707e7c09c6a9; src/edge_lab/settlement.py sha256=1b8b313a3d0fbcff982bd109c01616b6b6696e90d33519fa3869dee085c06cde (tests/invariants/test_exp001_frozen_artifacts.py enforces these and the dataset hash)",
  "Stage B only (prospective): kalshi_public order books captured at each decision time (+ a latency re-check snapshot) after this freeze",
]

features = [
  "forecast_max_f: the NWS PFM Central Park daytime max for D from the issuance selected by the availability rule",
  "meteorological season of D (DJF/MAM/JJA/SON), V2 only",
  "bracket bounds from captured market fields strike_type/floor_strike/cap_strike, checked against rules text (settlement.resolve), Stage B only",
]

success_criteria = [
  "Stage A (historical probability validation, test 2025-01-01..2026-09-21, evaluated once in Gate 4): mean per-day log-score difference (selected model - R0) > 0 with the 95% block-bootstrap lower bound > 0, AND randomized-PIT central-80% coverage (u = F(y-1) + v*P(y) from the same clamped pmf used for scoring, v from random.Random(20260922) in date order; fraction with 0.10 <= u <= 0.90) within [0.75, 0.85]. A Stage A pass is NOT evidence of a trading edge.",
  "Stage B (prospective shadow trading, BLOCKED-ON-OWNER for scheduled collection): signal 'buy 1 YES if p - cost_yes >= 0.05; buy 1 NO if (1 - p) - cost_no >= 0.05' (cost = fees.cost_per_contract(1, ask)). Valid decision day = the event's market list and a book for every open bracket stored in [decision - 5 min, decision], plus a re-check book for every bracket 10-15 min later; any missing makes the day invalid (excluded and counted; no partial days). Daily value = sum of net P&L of filled trades, 0 on a valid day with no signal or where every signal ended NO_FILL_UNVERIFIED; brackets where settlement.resolve returns UNKNOWN are never traded. Exactly two looks, at the 180th and 365th valid day, each with a 97.5% block-bootstrap interval (alpha 0.025, Bonferroni). PASS at a look: mean daily net P&L > 0 and lower bound > 0 (SHADOW_POSITIVE, not EDGE_PROVEN).",
]

failure_criteria = [
  "Stage A fails if either Stage A condition fails; then Stage B is not run for this model",
  "Stage B fails at a look (180th or 365th valid day) if the 97.5% block-bootstrap upper bound of mean daily net P&L < 0, or if Stage A failed (then Stage B is not run for this model)",
  "Stage B is INCONCLUSIVE if neither PASS nor FAIL holds at the 365th valid day; no other looks are taken",
  "Any result that depends on mid-price, last-price, stale-book or retroactive fills is void",
]

risk_constraints = [
  "Research only: no orders, no credentials, no funded account, no order-execution code",
  "Stage B is shadow only; it simulates fills from captured books under the execution model and never sends orders",
  "Test split is evaluated exactly once, after this freeze, with nothing changed; any later change is a new experiment",
]

limitations = [
  "No historical market prices or order books exist for us before 2026-09-22; no historical model-vs-market comparison is made or required (Stage A is probability validation only)",
  "Small sample: one series, one decision per day; about 470 effective test days; Stage B can detect only large edges within 180-365 days (gate3/POWER.md)",
  "Rules name The Weather Company from 2026-08-14 while certified terms name NWS; Kalshi values matched NWS on 39/39 TWC-era days but TWC data itself cannot be checked (terms prohibit automated access)",
  "PFM daytime max (7 AM-7 PM LST) differs in definition from the CLI calendar-day max; the empirical error pmf absorbs this, it is not corrected",
  "Fee coefficient 0.07 is taken from Kalshi's documented worked example; the fee-schedule PDF was behind a bot checkpoint and not retrieved; re-verify before any Stage B result",
  "Full PFM products are not in git (exact extracts + hashes only; ADR 0011)",
  "PFMOKX issuance thinned from mid-2025: chosen forecasts are older at the decision time in later test years (median ~2.4-2.5 h in 2017-2024, 2.8 h in 2025, 3.5 h in 2026; ~3.0 h over the test period; gate3/QUALITY.md); disclosed before any validation/test error was computed and not adjusted for",
  "Test-period protection is procedural: dataset.csv holds test forecasts and labels; no validation/test error is computed before Gate 4",
]

gates_required = [
  "Gate 2: settlement validation — PASSED 2026-09-22 (gate2/REPORT.md)",
  "Gate 3: point-in-time historical dataset and preregistration (gate3/)",
  "Gate 4: fit and evaluate the frozen baseline on the predeclared protocol",
]

[periods]
train = "2017-01-01..2022-12-31 (target dates; usable rows only)"
validation = "2023-01-01..2024-12-31 (V1/V2 selection only)"
test = "2025-01-01..2026-09-21 (Stage A, evaluated once)"
stage_b = "from the first valid decision day after the freeze; looks at exactly the 180th and 365th valid decision days"

[costs]
fee_model = "edge_lab.fees v1: model fee = fee_multiplier (1 for KXHIGHNY) * 0.07 * C * P * (1 - P); trade fee = ceil to $0.000001; cash change = floor to the cent of (-P*C - trade fee) (non-direct member); taker only; no maker fills, no rounding rebates, no settlement fee assumed. Evidence: gate3/evidence/kalshi_docs_fee_rounding.html, kalshi_series_KXHIGHNY.json"
spread = "Crossed in full: YES bought at 1 - best NO bid, NO bought at 1 - best YES bid, from the captured book; never mid or last price"

[execution]
fill_model = "Stage B only: order book captured in [decision - 5 min, decision] (else NO_BOOK, no trade); 1 contract at the implied ask, size must be <= displayed size; fill counts only if a book captured 10-15 min later still offers <= entry price with size >= 1 (else NO_FILL_UNVERIFIED); no retroactive fills; settle with settlement.resolve on the official label"
latency = "10 minutes (fill confirmation window 10-15 min after the decision snapshot)"
max_book_age = "5 minutes"

[artifacts]
spec = "experiments/EXP-001-kxhighny-nws-vs-market/experiment.toml"
log = "experiments/EXP-001-kxhighny-nws-vs-market/README.md"

# Gate 4 amendments. Recorded and committed before any validation or test score was
# computed. None changes a model, variant, fit window, threshold, feature or distribution.

[[amendments]]
date = "2026-09-22"
field = "model"
change = "Gate 4 pre-validation (1/6): R1's mu and sigma are the fit-window mean and population sd of the raw, unclamped errors k = y - f."
reason = "The frozen text says only 'from fit-window errors'; the +-20 clamp is defined for the empirical pmf. R1 is reported only and cannot affect the Stage A verdict. Decided before any validation or test score existed."

[[amendments]]
date = "2026-09-22"
field = "success_criteria"
change = "Gate 4 pre-validation (2/6): PIT inputs from the clamped pmf: F(y-1) = math.fsum of the pmf over k < k_c in ascending k, P(y) = pmf[k_c], with k_c = clamp(y - f, -20, 20) for every outcome (outcomes with |k| > 20 use the clamped k, as the frozen text states)."
reason = "Pins the summation so the randomized PIT is one deterministic computation. No model, window or threshold changes."

[[amendments]]
date = "2026-09-22"
field = "success_criteria"
change = "Gate 4 pre-validation (3/6): Stage A condition 2 coverage bounds are inclusive at both ends (0.75 <= coverage <= 0.85). Condition 1 uses strict inequalities (mean > 0 and lower bound > 0), as does the V1/V2 selection rule (ties and lower bound <= 0 select V1)."
reason = "'within [0.75, 0.85]' is a closed interval and '> 0' is strict; stated explicitly so no borderline outcome is open to interpretation after the fact."

[[amendments]]
date = "2026-09-22"
change = "Gate 4 pre-validation (4/6): owner-requested reporting additions, reported only and never pass/fail criteria: per-day multi-category Brier score 1 - 2 P(scored outcome) + sum_y P(y)^2 over the model's full support (R0: its support; R1: integers f +- 60, floored probabilities), mean log loss (= - mean log score), and the model - R1 per-day log-score difference with its 95% block-bootstrap interval."
reason = "Owner request for more complete reporting. These quantities do not enter the V1/V2 selection or the Stage A decision."

[[amendments]]
date = "2026-09-22"
change = "Gate 4 pre-validation (5/6): experiment status after Stage A. FAIL -> status CONCLUDED_FAIL with a [result] table (code_commit, dataset_version, report, summary). PASS -> status RUNNING (Stage B pending), with a dated Log entry."
reason = "A Stage A failure ends EXP-001 for this model; a pass leaves Stage B open. The registry lifecycle is fixed before the result is known."

[[amendments]]
date = "2026-09-22"
field = "execution"
change = "Gate 4 pre-validation (6/6): Stage B operational definitions. (a) The latency re-check window is measured per bracket from that bracket's decision-snapshot receipt time: [+10 min, +15 min]. (b) If several complete in-window decision captures exist, the latest complete one counts. (c) 'Open bracket' = a market of the target event whose status is active/open in the decision-time market list. (d) The live forecast input is NWS PFMOKX from api.weather.gov (/products/types/PFM/locations/OKX) under the same WMO-header, cutoff, age and suffix rules as the historical dataset. (e) Forward collection runs regardless of the Stage A outcome as research evidence, but Stage B evaluation for EXP-001 remains conditional on a Stage A PASS."
reason = "Decided before any Stage B data exists, to remove ambiguity in the frozen execution and valid-day text. The fill model, latency, book age, signal threshold, looks and intervals are unchanged. Forward collection itself still needs owner approval for scheduling (ADR 0008)."
