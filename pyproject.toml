[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-edge-lab"
version = "0.1.0"
description = "Read-only market-edge research and data collection"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
edge-lab = "edge_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Market Edge Terminal v1 assets: served from an exact allowlist (dashboard/html.py STATIC_FILES).
"edge_lab.dashboard" = ["static/*.css", "static/*.js", "static/*.svg", "static/*.txt", "static/*.md",
                        "static/fonts/*.woff2", "static/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
